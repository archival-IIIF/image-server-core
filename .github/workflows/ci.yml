name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel outdated runs when new commits are pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image (no push)
        run: docker build -t image-server-core:ci .